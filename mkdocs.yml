site_name: spinterp
site_description: Sparse Grid Interpolation Toolbox for Python
site_url: https://eggzec.github.io/spinterp/
docs_dir: docs
site_dir: site

repo_name: eggzec/spinterp
repo_url: https://github.com/eggzec/spinterp

copyright: "Copyright &copy; 2026 eggzec. All Rights Reserved."

# ---------------------------------------------------------------------------
# Theme
# ---------------------------------------------------------------------------
theme:
  name: material
  language: en

  features:
    - content.code.copy
    - content.code.annotate
    - navigation.instant
    - navigation.instant.progress
    - navigation.tracking
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.indexes
    - toc.follow
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - search.share

  palette:
    - scheme: default
      primary: blue grey
      accent: black
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: blue grey
      accent: white
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

  font:
    text: Roboto
    code: Roboto Mono

# ---------------------------------------------------------------------------
# Navigation
# ---------------------------------------------------------------------------
nav:
  - Home: index.md
  - Installation: installation.md
  - Quick Start: quickstart.md
  - Theory:
    - Linear Basis Functions: theory/linear-basis.md
    - Polynomial Basis Functions: theory/polynomial-basis.md
    - Dimensional Adaptivity: theory/dimension-adaptive.md
    - Bibliography: theory/bibliography.md
  - API Reference:
    - Overview: usage/index.md
    - Computing Derivatives: usage/derivatives.md
    - Numerical Integration: usage/integration.md
    - Improving Performance: usage/performance.md

# ---------------------------------------------------------------------------
# Plugins
# ---------------------------------------------------------------------------
plugins:
  - search:
  - minify:
      minify_html: true

# ---------------------------------------------------------------------------
# Markdown extensions
# ---------------------------------------------------------------------------
markdown_extensions:
  - attr_list
  - md_in_html
  - pymdownx.blocks.caption
  - tables
  - toc:
      permalink: true
      title: Page contents
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      pygments_lang_class: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.arithmatex:
      generic: true

extra_css:
  - assets/stylesheets/extra.css

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/eggzec/spinterp
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/spinterp/

extra_javascript:
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js

# ---------------------------------------------------------------------------
# Validation
# ---------------------------------------------------------------------------
validation:
  nav:
    omitted_files: warn
    not_found: warn
    absolute_links: warn
  links:
    not_found: warn
    anchors: warn
    absolute_links: relative_to_docs
    unrecognized_links: warn
